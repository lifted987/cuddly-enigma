<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore | TrimFinder</title><link rel="stylesheet" href="3.css"></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="3.html"><span class="brand-icon">✂</span><span>Trim<b>Finder</b></span></a><nav class="desktop-nav"><a href="3.html">Home</a><a class="active" href="trim-explore.html">Explore</a><a href="trim-map.html">Map</a><a href="trim-favorites.html">Favorites</a><a href="3.html#profile">Profile</a></nav><button class="menu-toggle" id="menuToggle" aria-label="Open menu">☰</button></div><nav class="mobile-menu" id="mobileMenu"><a href="3.html">Home</a><a href="trim-explore.html">Explore</a><a href="trim-map.html">Map</a><a href="trim-favorites.html">Favorites</a><a href="3.html#profile">Profile</a></nav></header><main style="max-width:1160px;margin:auto;padding:65px 22px 90px"><p class="eyebrow green">TRIMFINDER DIRECTORY</p><h1>Explore your next<br><em>great trim.</em></h1><p class="hero-copy">Browse sample barbers across Port Harcourt by area or service.</p><input id="search" type="search" placeholder="Search GRA, Woji, fade..." style="padding:14px;width:min(600px,100%);border:1px solid var(--line);border-radius:8px"><div class="salon-grid" id="grid" style="margin-top:30px"></div></main><script>const data=[['The Garden Groom','GRA Phase 1','Low Cut · Fade','₦3,000'],['Riverside Barber Co.','Woji','Low Cut · Hair + Beard','₦3,500'],['Freshcut Rumuola','Rumuola','Low Cut · Beard Trim','₦2,500'],['Cut Culture PH','Trans Amadi','Low Cut · Fade','₦3,000'],['Okrika Grooming House','D-Line','Fade · Hair + Beard','₦2,800'],['The Trim Room PH','Peter Odili Road','Fade · Beard Trim','₦5,000'],['Sharp Edge Barbers','Rumuokoro','Low Cut · Fade','₦2,500'],['Ikwerre Barber Studio','Eliozu','Fade · Hair + Beard','₦4,500']];function draw(){const q=document.querySelector('#search').value.toLowerCase();document.querySelector('#grid').innerHTML=data.filter(x=>x.join(' ').toLowerCase().includes(q)).map(x=>`<article class="salon-card"><div class="card-body"><h3>${x[0]}</h3><p class="card-location">⌖ ${x[1]}, Port Harcourt</p><p>${x[2]}</p><strong>${x[3]} haircut from</strong></div></article>`).join('')||'<p>No salons found in that search.</p>'}document.querySelector('#search').addEventListener('input',draw);document.querySelector('#menuToggle').addEventListener('click',()=>document.querySelector('#mobileMenu').classList.toggle('open'));draw();</script></body></html>
