<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Explore | TrimFinder</title><link rel="stylesheet" href="3.css"><style>.page-shell{max-width:1160px;margin:auto;padding:65px 22px 90px}.page-shell h1{font-size:clamp(42px,6vw,68px)}.page-lead{max-width:530px;color:var(--muted);line-height:1.6;font-size:17px}.page-search{display:flex;max-width:600px;margin:25px 0 30px}.page-search input{flex:1;padding:14px;border:1px solid var(--line);border-radius:8px 0 0 8px;outline-color:var(--green)}.page-search button{border:0;border-radius:0 8px 8px 0;background:var(--green);color:#fff;padding:0 20px;font-weight:700}.simple-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.simple-card{padding:20px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 14px #193d2808}.simple-card h2{font-size:19px;letter-spacing:-.5px}.simple-card p{color:var(--muted);font-size:13px}.simple-card strong{color:var(--green);font-size:13px}@media(max-width:700px){.page-shell{padding:45px 18px 70px}.simple-grid{grid-template-columns:1fr}.page-search button{padding:0 13px}}
</style></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="3.html"><span class="brand-icon">✂</span><span>Trim<b>Finder</b></span></a><nav class="desktop-nav"><a href="3.html">Home</a><a class="active" href="3-explore.html">Explore</a><a href="3-map.html">Map</a><a href="3-favorites.html">Favorites</a><a href="3.html#profile">Profile</a></nav><button class="menu-toggle" id="menuToggle">☰</button></div><nav class="mobile-menu" id="mobileMenu"><a href="3.html">Home</a><a href="3-explore.html">Explore</a><a href="3-map.html">Map</a><a href="3-favorites.html">Favorites</a><a href="3.html#profile">Profile</a></nav></header><main class="page-shell"><p class="eyebrow green">TRIMFINDER DIRECTORY</p><h1>Find your next<br><em>great trim.</em></h1><p class="page-lead">Browse salons across Nigeria by name, neighborhood, service, or price.</p><form class="page-search" id="exploreForm"><input id="exploreSearch" type="search" placeholder="Search Ikeja, Fade, beard..." aria-label="Search salons"><button type="submit">Search</button></form><div class="simple-grid" id="exploreGrid"></div></main><script>const salons=[['The Gentlemen’s Club','Ikeja, Lagos','Low Cut · Skin Fade','₦3,000'],['Lagos Barber Co.','Lekki Phase 1, Lagos','Low Cut · Fade','₦3,500'],['Freshcut Yaba','Yaba, Lagos','Low Cut · Beard Trim','₦2,500'],['Cut Culture','Surulere, Lagos','Low Cut · Fade','₦3,000'],['Opebi Grooming House','Opebi, Lagos','Fade · Hair + Beard','₦2,800'],['The Trim Room','Victoria Island, Lagos','Fade · Beard Trim','₦5,000'],['Sharp Edge Barbers','Gbagada, Lagos','Low Cut · Fade','₦2,500'],['Ikoyi Barber Studio','Ikoyi, Lagos','Fade · Hair + Beard','₦4,500']];const grid=document.querySelector('#exploreGrid');function draw(){const q=document.querySelector('#exploreSearch').value.toLowerCase();grid.innerHTML=salons.filter(s=>s.join(' ').toLowerCase().includes(q)).map(s=>`<article class="simple-card"><h2>${s[0]}</h2><p>⌖ ${s[1]}</p><p>✂ ${s[2]}</p><strong>Haircut from ${s[3]}</strong></article>`).join('')||'<p>No salons found. Try another area or service.</p>'}document.querySelector('#exploreForm').addEventListener('submit',e=>e.preventDefault());document.querySelector('#exploreSearch').addEventListener('input',draw);document.querySelector('#menuToggle').addEventListener('click',()=>document.querySelector('#mobileMenu').classList.toggle('open'));draw();</script></body></html>
