<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Favorites | TrimFinder</title><link rel="stylesheet" href="3.css"></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="3.html"><span class="brand-icon">✂</span><span>Trim<b>Finder</b></span></a><nav class="desktop-nav"><a href="3.html">Home</a><a href="trim-explore.html">Explore</a><a href="trim-map.html">Map</a><a class="active" href="trim-favorites.html">Favorites</a><a href="3.html#profile">Profile</a></nav><button class="menu-toggle" id="menuToggle" aria-label="Open menu">☰</button></div><nav class="mobile-menu" id="mobileMenu"><a href="3.html">Home</a><a href="trim-explore.html">Explore</a><a href="trim-map.html">Map</a><a href="trim-favorites.html">Favorites</a><a href="3.html#profile">Profile</a></nav></header><main style="max-width:1160px;margin:auto;padding:65px 22px 90px"><p class="eyebrow green">YOUR STYLE BOARD</p><h1>Favourite<br><em>salons.</em></h1><p class="hero-copy">Your saved Port Harcourt salons, ready for the next trim.</p><div class="favorite-grid" id="grid"></div><div class="favorite-empty" id="empty"><span>♡</span><h3>No favourites yet</h3><p>Save a salon from the home page to see it here.</p><a href="3-explore.html" class="secondary-button">Explore salons</a></div></main><script>const data={1:['The Gentlemen’s Club','GRA Phase 1','₦3,000'],2:['Riverside Barber Co.','Woji','₦3,500'],3:['Freshcut Rumuola','Rumuola','₦2,500'],4:['Cut Culture PH','Trans Amadi','₦3,000'],5:['Okrika Grooming House','D-Line','₦2,800'],6:['The Trim Room PH','Peter Odili Road','₦5,000'],7:['Sharp Edge Barbers','Rumuokoro','₦2,500'],8:['Ikwerre Barber Studio','Eliozu','₦4,500']};let ids=JSON.parse(localStorage.getItem('trimfinder3-favorites')||'[]');const grid=document.querySelector('#grid');function draw(){grid.innerHTML=ids.map(id=>{const s=data[id];return s?`<article class="favorite-card"><div><h3>${s[0]}</h3><p>⌖ ${s[1]}, Port Harcourt</p><strong>Haircut from ${s[2]}</strong></div><button class="remove-favorite" data-id="${id}" aria-label="Remove ${s[0]}">×</button></article>`:''}).join('');document.querySelector('#empty').hidden=ids.length>0}grid.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;ids=ids.filter(id=>id!==Number(b.dataset.id));localStorage.setItem('trimfinder3-favorites',JSON.stringify(ids));draw()});document.querySelector('#menuToggle').addEventListener('click',()=>document.querySelector('#mobileMenu').classList.toggle('open'));draw();</script></body></html>
