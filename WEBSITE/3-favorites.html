<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Favorites | TrimFinder</title><link rel="stylesheet" href="3.css"><style>.page-shell{max-width:1160px;margin:auto;padding:65px 22px 90px}.page-shell h1{font-size:clamp(42px,6vw,68px)}.page-lead{max-width:530px;color:var(--muted);line-height:1.6;font-size:17px}.simple-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}.simple-card{display:flex;gap:14px;align-items:flex-start;padding:18px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 14px #193d2808}.simple-card-image{width:75px;height:75px;border-radius:9px;background:center/cover;flex:0 0 auto}.simple-card h2{font-size:18px;letter-spacing:-.5px;margin:0 0 5px}.simple-card p{color:var(--muted);font-size:12px;margin:0 0 7px}.simple-card strong{color:var(--green);font-size:12px}.remove-button{margin-left:auto;border:0;background:none;color:#d55d50;font-size:20px;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:70px 20px}.empty span{font-size:45px;color:var(--green)}.empty h2{color:var(--ink)}@media(max-width:700px){.page-shell{padding:45px 18px 70px}.simple-grid{grid-template-columns:1fr}}
</style></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="3.html"><span class="brand-icon">✂</span><span>Trim<b>Finder</b></span></a><nav class="desktop-nav"><a href="3.html">Home</a><a href="3-explore.html">Explore</a><a href="3-map.html">Map</a><a class="active" href="3-favorites.html">Favorites</a><a href="3.html#profile">Profile</a></nav><button class="menu-toggle" id="menuToggle">☰</button></div><nav class="mobile-menu" id="mobileMenu"><a href="3.html">Home</a><a href="3-explore.html">Explore</a><a href="3-map.html">Map</a><a href="3-favorites.html">Favorites</a><a href="3.html#profile">Profile</a></nav></header><main class="page-shell"><p class="eyebrow green">YOUR STYLE BOARD</p><h1>Favourite<br><em>salons.</em></h1><p class="page-lead">Your saved salons, ready whenever you need your next trim.</p><div class="simple-grid" id="favoritesGrid"></div><div class="empty" id="empty"><span>♡</span><h2>No favourites yet</h2><p>Save a salon from the home page and it will appear here.</p><a class="secondary-button" href="3-explore.html">Explore salons</a></div></main><script>const saved=JSON.parse(localStorage.getItem('trimfinder3-favorites')||'[]');const salons={1:['The Gentlemen’s Club','Ikeja, Lagos','₦3,000','https://images.unsplash.com/photo-1621605815971-fbc98d665033?auto=format&fit=crop&w=300&q=80'],2:['Lagos Barber Co.','Lekki Phase 1, Lagos','₦3,500','https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=300&q=80'],3:['Freshcut Yaba','Yaba, Lagos','₦2,500','https://images.unsplash.com/photo-1599351431202-1e0f0137899a?auto=format&fit=crop&w=300&q=80'],4:['Cut Culture','Surulere, Lagos','₦3,000','https://images.unsplash.com/photo-1593702295094-aea7c6c51c1e?auto=format&fit=crop&w=300&q=80'],5:['Opebi Grooming House','Opebi, Lagos','₦2,800','https://images.unsplash.com/photo-1599351431613-18ef1fdd27e1?auto=format&fit=crop&w=300&q=80'],6:['The Trim Room','Victoria Island, Lagos','₦5,000','https://images.unsplash.com/photo-1622286342621-4bd786c2447c?auto=format&fit=crop&w=300&q=80'],7:['Sharp Edge Barbers','Gbagada, Lagos','₦2,500','https://images.unsplash.com/photo-1599351431202-1e0f0137899a?auto=format&fit=crop&w=300&q=80'],8:['Ikoyi Barber Studio','Ikoyi, Lagos','₦4,500','https://images.unsplash.com/photo-1512690459411-b0fd1c86e7e1?auto=format&fit=crop&w=300&q=80']};const grid=document.querySelector('#favoritesGrid');function draw(){grid.innerHTML=saved.map(id=>{const s=salons[id];return s?`<article class="simple-card"><div class="simple-card-image" style="background-image:url('${s[3]}')"></div><div><h2>${s[0]}</h2><p>⌖ ${s[1]}</p><strong>Haircut from ${s[2]}</strong></div><button class="remove-button" data-id="${id}" aria-label="Remove ${s[0]}">×</button></article>`:''}).join('');document.querySelector('#empty').hidden=saved.length>0}grid.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;saved.splice(saved.indexOf(Number(b.dataset.id)),1);localStorage.setItem('trimfinder3-favorites',JSON.stringify(saved));draw()});document.querySelector('#menuToggle').addEventListener('click',()=>document.querySelector('#mobileMenu').classList.toggle('open'));draw();</script></body></html>
