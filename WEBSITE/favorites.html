<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Favorites | PH EATS</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="nav-wrap"><a class="brand" href="index.html"><span class="brand-icon">🍽</span><span>PH <b>EATS</b></span></a><nav class="desktop-nav"><a href="index.html">Home</a><a href="explore.html">Explore</a><a href="map.html">Map</a><a class="active" href="favorites.html">Favorites</a><a href="index.html#profile">Profile</a></nav><button class="menu-toggle" id="menuToggle">☰</button></div><nav class="mobile-menu" id="mobileMenu"><a href="index.html">Home</a><a href="explore.html">Explore</a><a href="map.html">Map</a><a href="favorites.html">Favorites</a></nav></header><main class="page-shell"><p class="kicker green">YOUR FOOD BOARD</p><h1>Favourite foods</h1><p class="page-lead">Your saved Port Harcourt restaurants, ready for the next meal.</p><div class="simple-grid" id="favoriteGrid"></div><div class="favorite-empty" id="empty"><span>♡</span><h2>No favourite foods yet</h2><p>Save a restaurant from the home page and it will appear here.</p><a class="secondary-button" href="explore.html">Explore restaurants</a></div></main><script>const names={1:['The Garden Grill','GRA Phase 2','₦4,500'],2:['Riverside Kitchen','Woji','₦3,800'],3:['Chop House','D-Line','₦2,500'],4:['Mama Nma Kitchen','Rumuola','₦3,000'],5:['Spice Route PH','Trans Amadi','₦6,500'],6:['Wok & Roll','Eliozu','₦5,500'],7:['Bella Napoli','Old GRA','₦7,000'],8:['Suya Corner','Rumuokoro','₦2,000']};const ids=JSON.parse(localStorage.getItem('ph-eats-favorites')||'[]');const grid=document.querySelector('#favoriteGrid');grid.innerHTML=ids.map(id=>{const x=names[id];return x?`<article class="simple-card"><span class="simple-icon">♥</span><div><h2>${x[0]}</h2><p>⌖ ${x[1]}, Port Harcourt</p><strong>Meals from ${x[2]}</strong><button class="remove-page-favorite" data-id="${id}">Remove</button></div></article>`:''}).join('');document.querySelector('#empty').hidden=ids.length>0;document.querySelector('#menuToggle').addEventListener('click',()=>document.querySelector('#mobileMenu').classList.toggle('open'));document.querySelector('#favoriteGrid').addEventListener('click',e=>{if(!e.target.matches('[data-id]'))return;const next=ids.filter(id=>id!==Number(e.target.dataset.id));localStorage.setItem('ph-eats-favorites',JSON.stringify(next));location.reload()});</script></body></html>
