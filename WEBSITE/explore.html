<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore | PH EATS</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="nav-wrap"><a class="brand" href="index.html"><span class="brand-icon">🍽</span><span>PH <b>EATS</b></span></a><nav class="desktop-nav"><a href="index.html">Home</a><a class="active" href="explore.html">Explore</a><a href="map.html">Map</a><a href="favorites.html">Favorites</a><a href="index.html#profile">Profile</a></nav><button class="menu-toggle" id="menuToggle">☰</button></div><nav class="mobile-menu" id="mobileMenu"><a href="index.html">Home</a><a href="explore.html">Explore</a><a href="map.html">Map</a><a href="favorites.html">Favorites</a></nav></header><main class="page-shell"><p class="kicker green">PH EATS DIRECTORY</p><h1>Explore Port Harcourt</h1><p class="page-lead">Search the complete local restaurant guide by food, cuisine, or neighborhood.</p><div class="page-search"><input id="exploreSearch" type="search" placeholder="Search Jollof, GRA, Suya..."><select id="cuisine"><option value="all">All cuisines</option><option>Nigerian</option><option>Seafood</option><option>Fast Food</option><option>BBQ/Grills</option></select></div><div class="simple-grid" id="exploreGrid"></div></main><script src="script.js"></script><script>const data=[['The Garden Grill','GRA Phase 2','Nigerian · BBQ/Grills','Jollof Rice + Chicken','₦4,500'],['Riverside Kitchen','Woji','Continental · Seafood','Catfish Pepper Soup','₦3,800'],['Chop House','D-Line','Fast Food · Local Food','Shawarma','₦2,500'],['Mama Nma Kitchen','Rumuola','Nigerian · Local Food','Pounded Yam + Egusi','₦3,000'],['Spice Route PH','Trans Amadi','Indian · Continental','Chicken Biryani','₦6,500'],['Wok & Roll','Eliozu','Chinese · Fast Food','Chicken Noodles','₦5,500']];const grid=document.querySelector('#exploreGrid');function draw(){const q=document.querySelector('#exploreSearch').value.toLowerCase();const c=document.querySelector('#cuisine').value;grid.innerHTML=data.filter(x=>(x.join(' ').toLowerCase().includes(q))&&(c==='all'||x[2].includes(c))).map(x=>`<article class="simple-card"><span class="simple-icon">🍴</span><div><h2>${x[0]}</h2><p>⌖ ${x[1]}, Port Harcourt</p><small>${x[2]}</small><strong>Popular: ${x[3]} · ${x[4]}</strong></div></article>`).join('')||'<div class="favorite-empty"><h2>No restaurants found</h2><p>Try another food or area.</p></div>'}document.querySelector('#exploreSearch').addEventListener('input',draw);document.querySelector('#cuisine').addEventListener('change',draw);document.querySelector('#menuToggle').addEventListener('click',()=>document.querySelector('#mobileMenu').classList.toggle('open'));draw();</script></body></html>
